    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('✅ Service Worker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.error('❌ Service Worker registration failed:', error);
            });
        });
      }

      // Connection status monitoring
      function updateConnectionStatus() {
        const isOnline = navigator.onLine;
        document.body.classList.toggle('offline', !isOnline);

        if (!isOnline) {
          // Show offline notification if implemented
          console.log('📡 App is now offline');
        } else {
          console.log('🌐 App is back online');
        }
      }

      window.addEventListener('online', updateConnectionStatus);
      window.addEventListener('offline', updateConnectionStatus);
      updateConnectionStatus();

      // Performance monitoring
      if ('performance' in window && 'measure' in performance) {
        window.addEventListener('load', () => {
          setTimeout(() => {
            const navigation = performance.getEntriesByType('navigation')[0];
            if (navigation) {
              console.log('🚀 Page Load Performance:');
              console.log(`- DNS Lookup: ${navigation.domainLookupEnd - navigation.domainLookupStart}ms`);
              console.log(`- TCP Connection: ${navigation.connectEnd - navigation.connectStart}ms`);
              console.log(`- Server Response: ${navigation.responseEnd - navigation.requestStart}ms`);
              console.log(`- DOM Load: ${navigation.domContentLoadedEventEnd - navigation.navigationStart}ms`);
              console.log(`- Full Load: ${navigation.loadEventEnd - navigation.navigationStart}ms`);
            }
          }, 0);
        });
      }
    </script>
